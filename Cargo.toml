[workspace]
resolver = "3"
members = ["crates/sapu-core", "crates/sapu-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/xhijack/sapu"
authors = ["Ramdani"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
trash = "5"
dirs = "6"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
disallowed_methods = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
