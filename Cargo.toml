[workspace]
resolver = "3"
members = ["crates/sapu-core", "crates/sapu-ai", "crates/sapu-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/xhijack/sapu"
authors = ["Ramdani"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
trash = "5"
dirs = "6"
tempfile = "3"
jwalk = "0.8"
fs4 = "0.13"
toml = "0.9"
include_dir = "0.7"
glob = "0.3"
blake3 = "1"
rayon = "1"
sysinfo = "0.37"
ureq = { version = "3", features = ["json"] }
plist = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
disallowed_methods = "deny"

# Smaller debug artifacts: line tables are enough for backtraces and keep
# target/ from growing to tens of GB on a laptop.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
