# Builds installers for every platform when a version tag is pushed and
# attaches them to a draft GitHub release. Code signing and notarization
# run only when the corresponding secrets exist (PRD §13, open question Q3);
# without them the artefacts are unsigned and meant for testing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            args: ""
            targets: ""
          - name: windows-arm64
            os: windows-latest
            args: --target aarch64-pc-windows-msvc
            targets: aarch64-pc-windows-msvc
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
            targets: ""
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: ""
            targets: ""
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev rpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (set in repo secrets when Q3 is decided)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater artefact signing (tauri signer generate)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Sapu ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. Unsigned builds show OS warnings until code signing is funded (PRD Q3)."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  cli:
    name: cli (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sapu-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          bin=sapu; [[ "${{ runner.os }}" == "Windows" ]] && bin=sapu.exe
          cp "target/${{ matrix.target }}/release/$bin" dist/
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "sapu-cli-${{ github.ref_name }}-${{ matrix.target }}.zip" "$bin"
          else
            tar czf "sapu-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" "$bin"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/sapu-cli-*
