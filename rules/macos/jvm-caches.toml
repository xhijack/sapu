[rule]
id = "macos-jvm-caches"
name = { id = "Cache Gradle & Maven", en = "Gradle & Maven caches" }
description = { id = "Dependensi Java/Android yang diunduh Gradle dan Maven. Build berikutnya mengunduh ulang, bisa lama.", en = "Java/Android dependencies downloaded by Gradle and Maven. The next build downloads them again, which can take a while." }
risk = "yellow"
profile = "developer"
group = "package_cache"

[[match]]
path = "~/.gradle/caches"
kind = "dir_contents"
[[match]]
path = "~/.m2/repository"
kind = "dir_contents"
