[rule]
id = "macos-trash"
name = { id = "Kosongkan Trash", en = "Empty the Trash" }
description = { id = "File yang sudah kamu buang. Setelah ini tidak bisa dipulihkan lagi.", en = "Files you already threw away. After this they cannot be restored." }
risk = "yellow"
profile = "general"
group = "trash"
permanent = true

[[match]]
path = "~/.Trash"
kind = "dir_contents"
