[rule]
id = "macos-jetbrains-caches"
name = { id = "Cache JetBrains & Android Studio", en = "JetBrains & Android Studio caches" }
description = { id = "Cache dan log IntelliJ, PyCharm, WebStorm, Android Studio, dan IDE JetBrains lain. Indeks dibangun ulang saat proyek dibuka, bisa beberapa menit.", en = "Caches and logs of IntelliJ, PyCharm, WebStorm, Android Studio and other JetBrains IDEs. Indexes rebuild when a project opens, which can take minutes." }
risk = "green"
profile = "developer"
group = "editors"

[[match]]
path = "~/Library/Caches/JetBrains"
kind = "dir_contents"

[[match]]
path = "~/Library/Caches/Google/AndroidStudio*"
kind = "dir_contents"

[[match]]
path = "~/Library/Logs/JetBrains"
kind = "dir_contents"
min_age_days = 7

[[match]]
path = "~/Library/Logs/Google/AndroidStudio*"
kind = "dir_contents"
min_age_days = 7
