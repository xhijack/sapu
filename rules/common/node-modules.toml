[rule]
id = "node-modules-stale"
name = { id = "node_modules proyek lama", en = "node_modules of stale projects" }
description = { id = "Dependensi proyek yang tidak disentuh lebih dari 30 hari. Dibuat ulang dengan npm install / pnpm install / yarn.", en = "Dependencies of projects untouched for more than 30 days. Recreated with npm install / pnpm install / yarn." }
risk = "yellow"
profile = "developer"
group = "node_modules"

[[match]]
kind = "dir_name"
name = "node_modules"
roots = ["~"]
max_depth = 7
unused_days = 30
skip = ["Library", ".*", "Applications", "Music", "Movies", "Pictures", "AppData"]
