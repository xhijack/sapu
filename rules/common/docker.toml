[rule]
id = "docker-images-dangling"
name = { id = "Image Docker tanpa tag", en = "Untagged Docker images" }
description = { id = "Lapisan image yang tertinggal setelah build atau pull ulang (tanpa tag). Tidak dipakai container mana pun; Docker membuatnya lagi bila perlu.", en = "Image layers left behind by rebuilds and re-pulls (no tag). No container uses them; Docker recreates them when needed." }
risk = "green"
profile = "developer"
group = "docker"

[command]
program = "docker"
args = ["image", "prune", "-f"]
requires = "docker"
estimate = ["docker", "images", "--filter", "dangling=true", "--format", "dangling	{{.Size}}"]
